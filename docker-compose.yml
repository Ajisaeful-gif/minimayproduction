services:
  postgres:
    image: postgres:16-alpine
    container_name: minimay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minimay
      POSTGRES_PASSWORD: minimay
      POSTGRES_DB: minimay_production
    ports:
      - "5433:5432"
    volumes:
      - minimay_postgres_data:/var/lib/postgresql/data

volumes:
  minimay_postgres_data:
